name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('src/frontend/package-lock.json') != '' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        if: ${{ hashFiles('src/frontend/package-lock.json') != '' }}
        working-directory: src/frontend
        run: npm ci
      - name: Build
        if: ${{ hashFiles('src/frontend/package-lock.json') != '' }}
        working-directory: src/frontend
        run: npm run build --if-present
      - name: Test
        if: ${{ hashFiles('src/frontend/package-lock.json') != '' }}
        working-directory: src/frontend
        run: npm test --if-present
      - name: Await frontend scaffold
        if: ${{ hashFiles('src/frontend/package-lock.json') == '' }}
        run: echo "src/frontend/package-lock.json is not present yet; skipping TypeScript checks."

  backend:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ hashFiles('src/backend/pyproject.toml') != '' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/backend/pyproject.toml
            src/backend/requirements*.txt
      - name: Install dependencies
        if: ${{ hashFiles('src/backend/pyproject.toml') != '' }}
        working-directory: src/backend
        run: python -m pip install -e ".[dev]"
      - name: Test
        if: ${{ hashFiles('src/backend/pyproject.toml') != '' }}
        working-directory: src/backend
        run: pytest
      - name: Await backend scaffold
        if: ${{ hashFiles('src/backend/pyproject.toml') == '' }}
        run: echo "src/backend/pyproject.toml is not present yet; skipping Python checks."

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') != '' }}
        run: docker compose config
      - name: Await Compose scaffold
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') == '' }}
        run: echo "No Compose file is present yet; skipping configuration validation."

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/e2e/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --extra dev
      - name: Install E2E dependencies
        working-directory: src/e2e
        run: npm ci
      - name: Install Playwright browser
        working-directory: src/e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: src/e2e
        run: npm test

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [frontend, backend, compose, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Log in with Azure
        shell: pwsh
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
      - name: Provision infrastructure
        run: azd provision --no-prompt
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      - name: Deploy application
        run: azd deploy --no-prompt
