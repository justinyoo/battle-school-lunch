name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('src/frontend/package-lock.json') != '' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        if: ${{ hashFiles('src/frontend/package-lock.json') != '' }}
        working-directory: src/frontend
        run: npm ci
      - name: Build
        if: ${{ hashFiles('src/frontend/package-lock.json') != '' }}
        working-directory: src/frontend
        run: npm run build --if-present
      - name: Test
        if: ${{ hashFiles('src/frontend/package-lock.json') != '' }}
        working-directory: src/frontend
        run: npm test --if-present
      - name: Await frontend scaffold
        if: ${{ hashFiles('src/frontend/package-lock.json') == '' }}
        run: echo "src/frontend/package-lock.json is not present yet; skipping TypeScript checks."

  backend:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ hashFiles('src/backend/pyproject.toml') != '' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/backend/pyproject.toml
            src/backend/requirements*.txt
      - name: Install dependencies
        if: ${{ hashFiles('src/backend/pyproject.toml') != '' }}
        working-directory: src/backend
        run: python -m pip install -e ".[dev]"
      - name: Test
        if: ${{ hashFiles('src/backend/pyproject.toml') != '' }}
        working-directory: src/backend
        run: pytest
      - name: Await backend scaffold
        if: ${{ hashFiles('src/backend/pyproject.toml') == '' }}
        run: echo "src/backend/pyproject.toml is not present yet; skipping Python checks."

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') != '' }}
        run: docker compose config
      - name: Await Compose scaffold
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') == '' }}
        run: echo "No Compose file is present yet; skipping configuration validation."
