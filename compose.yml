services:
  backend:
    build: ./src/backend
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 5 }
  frontend:
    build: ./src/frontend
    ports: ["5173:80"]
    depends_on:
      backend: { condition: service_healthy }
